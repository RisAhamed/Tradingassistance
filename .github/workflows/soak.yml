# =============================================================================
# SOAK — 6-hour read-only live paper-trading soak (manual trigger only)
#
# WHAT THIS WORKFLOW DOES
#   Runs the live 1-minute bar pipeline (`scripts/soak_alpaca.py`) for a long
#   duration (~6 hours) on GitHub-hosted infrastructure to observe market-data
#   reliability, warm-up handoff, recovery, and stream stability over time.
#   Results (JSON/Markdown reports and the runtime log) are uploaded as
#   artifacts for later inspection.
#
# IMPORTANT PROPERTIES
#   - MANUAL TRIGGER ONLY (`workflow_dispatch`). It never runs on push or
#     pull_request, so a 6-hour job can never start automatically.
#   - READ-ONLY. `execution.enabled` stays false; the soak script forces the
#     order gate closed. NO ORDERS ARE EVER PLACED and no broker trading
#     client is constructed.
#   - SECRETS ARE INJECTED AT RUNTIME from GitHub Actions Secrets and are
#     NEVER committed or hardcoded in this file. The repository may be public;
#     every credential is referenced only as `${{ secrets.* }}`.
#   - A hard `timeout-minutes: 360` bounds the job below GitHub's 6-hour
#     maximum; the soak itself runs 350 minutes to leave headroom for
#     dependency installation, start-up, and artifact upload.
# =============================================================================

name: Soak

on:
  workflow_dispatch:

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install runtime requirements
        run: pip install -r requirements.txt

      - name: Verify credentials are present
        run: |
          if [ -z "${{ secrets.ALPACA_API_KEY }}" ]; then
            echo "ERROR: ALPACA_API_KEY secret is missing."
            exit 1
          fi
          echo "Credentials verified."

      - name: Run live soak (350 minutes, read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_NAME: ${{ secrets.GROQ_MODEL_NAME }}
        run: |
          python scripts/soak_alpaca.py --minutes 350 --report logs/reports/phase_soak_cloud.json

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            logs/reports/
            logs/trading-agent.log
          retention-days: 7
